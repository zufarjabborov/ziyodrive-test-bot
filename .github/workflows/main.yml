
name: ZiyoDrive avtomatik test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"

jobs:
  post-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Pythonni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kerakli kutubxonalarni o'rnatish
        run: |
          pip install pillow opencv-python-headless

      - name: Rasmlarni ZIP dan ajratish
        run: python extract_images.py

      - name: Ajratilgan rasmlarni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ajratilgan-rasmlar
          path: images/candidates/
          if-no-files-found: warn

      - name: Telegram kanalga test yuborish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
